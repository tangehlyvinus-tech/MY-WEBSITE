<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Page Layout Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        header,
        main,
        aside,
        footer {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        header {
            background-color: #e3f2fd;
        }

        main {
            background-color: #e8f5e9;
            display: flex;
            gap: 10px;
        }

        section {
            flex: 3;
            background-color: #fff3e0;
            padding: 10px;
            border-radius: 6px;
        }

        aside {
            flex: 1;
            background-color: #fffde7;
            padding: 10px;
            border-radius: 6px;
        }

        footer {
            background-color: #ede7f6;
            text-align: center;
        }

        img {
            display: block;
            margin: 20px auto;
            max-width: 100%;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <a href="#home">Home</a> |
            <a href="#about">About</a> |
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Home Section</h2>
            <p>This is the main content area.</p>
            <article>
                <h3>Article Example</h3>
                <p>Learning HTML structure step by step!</p>
            </article>
        </section>

        <aside>
            <h2>Sidebar</h2>
            <p>Extra info or ads can go here.</p>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 My Website | Footer Links</p>
    </footer>

    <!-- Insert the diagram image here -->
    <img src="HTML_Page_Layout_Diagram.jpg" alt="HTML Page Layout Diagram">

</body>

</html>
